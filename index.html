<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb6c1, #ffe4ec);
    font-family: system-ui, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #card {
    background: white;
    padding: 30px 20px 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    text-align: center;
    width: min(90vw, 320px);
    position: relative;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 25px;
  }

  .buttons {
    position: relative;
    height: 120px;
  }

  button {
    font-size: 1.1rem;
    padding: 14px 0;
    width: 120px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.25s ease;
  }

  #yes {
    background: #ff3b6b;
    color: white;
    z-index: 2;
  }

  #no {
    background: #555;
    color: white;
    position: absolute;
    left: 150px;
    top: 0;
  }

  .heart {
    position: fixed;
    font-size: 22px;
    animation: float 1.8s ease forwards;
    pointer-events: none;
  }

  @keyframes float {
    0% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-120px) scale(1.6);
    }
  }
</style>
</head>

<body>

<div id="card">
  <h1 id="text">Will you be my valentine? 💖</h1>
  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const text = document.getElementById("text");
  const card = document.getElementById("card");

  let scale = 1;

  no.addEventListener("click", () => {
    scale += 0.15;
    yes.style.transform = `scale(${scale})`;

    const bounds = card.getBoundingClientRect();
    const maxX = bounds.width - no.offsetWidth;
    const maxY = bounds.height - no.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    no.style.left = x + "px";
    no.style.top = y + "px";
  });

  yes.addEventListener("click", () => {
    yes.remove();
    no.remove();
    text.textContent = "hehe ily 💘";

    for (let i = 0; i < 30; i++) {
      spawnHeart();
    }
  });

  function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💘";

    const x = window.innerWidth / 2 + (Math.random() * 120 - 60);
    const y = window.innerHeight / 2;

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1800);
  }
</script>

</body>
</html>
